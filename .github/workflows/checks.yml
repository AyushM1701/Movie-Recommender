name: CineMatch checks

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMDB_API_KEY: ""
      CINEMATCH_ENABLE_POSTER_LOOKUP: "0"
      CINEMATCH_SECRET_KEY: ci-disposable-secret
      CINEMATCH_DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Static syntax checks
        run: |
          python -m compileall -q backend
          node --check frontend/assets/app.js
      - name: Python lint
        run: python -m ruff check backend
      - name: Behavior tests
        run: python -m unittest discover -s backend/tests -v
      - name: Frontend behavior tests
        run: node --test frontend/tests/*.test.mjs
      - name: Clean offline artifact build
        run: python -m backend.data_preprocessing --semantic-backend lsa
      - name: Dependency consistency
        run: python -m pip check
